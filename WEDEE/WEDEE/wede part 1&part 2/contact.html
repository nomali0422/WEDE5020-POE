    <link rel="stylesheet" href="css/style.css">

<body>
    <header><img src="images/logo.png" alt="Logo"></header>
    <nav>

    <main>
        <h1>Contact & Book Now</h1>
        <div class="banner">
            <div class="banner-text" style="flex:1;">
                <h2>Visit Us</h2>
                <p><b>Address:</b> 123 Vilakazi Street, Soweto</p>
                <p><b>Phone:</b> 011 555 1234</p>
                <p><b>Hours:</b> Mon-Sun: 10am - 10pm</p>
                <p><b>Email:</b> bookings@nextlevel.co.za</p>
            </div>
            <form style="flex:1;">
                <h2>Quick Booking</h2>
                <label>Full Name</label><input type="text" required>
                <label>Phone</label><input type="tel" required>
                <label>Service</label>
                <select required>
                    <option value="">-- Select --</option>
                    <option>VR Experience</option>
                    <option>Racing Simulator</option>
                    <option>Escape Room</option>
                    <option>Birthday Bronze R750</option>
                    <option>Birthday Gold R1500</option>
                </select>
                <label>Date</label><input type="date" required>
                <label>Message</label><textarea rows="3"></textarea>
                <button type="submit" class="btn" style="width:100%; border:none; cursor:pointer;">BOOK NOW</button>
            </form>
        </div>
    </main>
